<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>GD Macro Hub</title>
<style>
:root {
  color-scheme: dark;
  --bg:#111318; --card:#22252c; --surface:#1b1d23;
  --accent:#b6f28b; --muted:#a6a8b2; --border:#373a43;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5f5f7;font-family:system-ui,sans-serif}
header{padding:26px 18px;background:radial-gradient(ellipse at top right,#34452d,transparent 60%),#191b1f;border-bottom:1px solid var(--border)}
header h1{max-width:1100px;margin:auto;font-size:27px}
header h1 span{color:var(--accent)}
header p{max-width:1100px;margin:6px auto 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:22px 16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
input,select{background:var(--surface);color:white;border:1px solid var(--border);padding:13px;border-radius:12px;font:inherit}
input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:17px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:19px;overflow:hidden}
.preview{aspect-ratio:16/9;background:#292c33}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{height:100%;display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:25px;background:linear-gradient(135deg,#30382d,#191b20)}
.content{padding:16px}
h2{font-size:20px;margin:0 0 9px;overflow-wrap:anywhere}
.tag{display:inline-block;background:#343b30;color:var(--accent);padding:5px 9px;border-radius:8px;font-size:12px}
.info{color:var(--muted);font-size:13px;line-height:1.9;margin-top:12px;overflow-wrap:anywhere}
.download{display:block;margin-top:14px;padding:12px;border-radius:12px;background:var(--accent);color:#172012;text-align:center;text-decoration:none;font-weight:750}
#status{color:var(--muted);padding:18px 0}
footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>GD <span>Macro Hub</span></h1>
  <p>Geometry Dash • Macro showcase & downloads</p>
</header>
<main>
  <div class="toolbar">
    <input id="search" placeholder="🔎 Поиск уровня или автора">
    <select id="difficulty">
      <option value="">Все сложности</option>
      <option>Easy Demon</option>
      <option>Medium Demon</option>
      <option>Hard Demon</option>
      <option>Insane Demon</option>
      <option>Extreme Demon</option>
      <option>Impossible</option>
    </select>
  </div>
  <div id="status">Загрузка макросов...</div>
  <div id="cards" class="grid"></div>
</main>
<footer>GD Macro Hub • Community project</footer>

<script type="module">
import { db } from "./firebase.js";
import {
  collection, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const cards = document.querySelector("#cards");
const status = document.querySelector("#status");
const search = document.querySelector("#search");
const difficulty = document.querySelector("#difficulty");
let macros = [];

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function safeURL(v) {
  try {
    const u = new URL(v);
    if (u.protocol === "https:" || u.protocol === "http:") return u.href;
  } catch {}
  return "";
}

function render() {
  const q = search.value.trim().toLowerCase();
  const d = difficulty.value;

  const list = macros.filter(m =>
    [m.level, m.author, m.bot].some(v =>
      String(v || "").toLowerCase().includes(q)
    ) && (!d || m.difficulty === d)
  );

  cards.innerHTML = list.map(m => {
    const img = safeURL(m.screenshot);
    const file = safeURL(m.download);
    const duration = Number(m.duration);
    const durationText = Number.isFinite(duration) ? duration + " сек." : "—";

    return `
      <article class="card">
        <div class="preview">
          ${img
            ? `<img src="${esc(img)}" alt="${esc(m.level)}" loading="lazy"
                 onerror="this.outerHTML='<div class=&quot;placeholder&quot;>GD Macro</div>'">`
            : `<div class="placeholder">${esc(m.level || "GD Macro")}</div>`}
        </div>
        <div class="content">
          <h2>${esc(m.level || "Без названия")}</h2>
          <span class="tag">${esc(m.difficulty || "Не указана")}</span>
          <div class="info">
            Автор: ${esc(m.author || "—")}<br>
            Бот: ${esc(m.bot || "—")}<br>
            FPS: ${esc(m.fps ?? "—")}<br>
            Длительность: ${esc(durationText)}<br>
            Версия GD: ${esc(m.version || "—")}
          </div>
          ${file
            ? `<a class="download" href="${esc(file)}" target="_blank" rel="noopener noreferrer">↓ Скачать макрос</a>`
            : ""}
        </div>
      </article>`;
  }).join("");

  status.textContent = `Макросов: ${list.length} из ${macros.length}`;
  if (!list.length) status.textContent += " • Ничего не найдено";
}

search.addEventListener("input", render);
difficulty.addEventListener("change", render);

onSnapshot(collection(db, "macros"), snapshot => {
  macros = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  render();
}, error => {
  console.error(error);
  status.textContent = "Ошибка загрузки. Проверь настройки Firestore и Rules.";
});
</script>
</body>
</html>
